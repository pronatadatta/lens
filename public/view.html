<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Lens</title>

<style>
  /* ==========================================================
     Presentation layer
     ----------------------------------------------------------
     Pure black everywhere: on the Ray-Ban Display's waveguide an
     unlit pixel is transparent, so #000 costs no power and reads
     as "not there" rather than as a visible frame.
     ========================================================== */
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;                 /* no cursor exists on-device */
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* The stage is a strict 600x600 block matching the AR display's
     square framing. On the glasses it fills the field; in a desktop
     browser it renders an exact preview of what the wearer sees.
     overflow:hidden makes it the clipping window that the pan-clamp
     math below is defined against. */
  #stage {
    position: relative;
    width: 600px;
    height: 600px;
    overflow: hidden;
    background: #000;
    flex: none;
  }

  /* The <img> element box always fills the stage; object-fit:contain
     letterboxes the actual pixels inside it. Zoom/pan are applied
     purely via `transform` so every update is GPU-composited and no
     layout is invalidated. */
  #photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: 50% 50%;    /* symmetric overflow => symmetric clamp */
    will-change: transform;
    backface-visibility: hidden;
    -webkit-user-drag: none;
    display: none;                /* revealed only in READY */
  }

  /* Status text for LOADING / ERROR / EMPTY. Dim by design — it is
     diagnostic, not chrome, and never shares the screen with a photo. */
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 48px;
    text-align: center;
    font: 400 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.04em;
    color: #6b6b6b;
    white-space: pre-line;
  }
  #overlay.visible { display: flex; }
  #overlay.error   { color: #b4726a; }

  /* ==========================================================
     HUD  —  swipe affordances
     ----------------------------------------------------------
     Transient by design. Persistent chrome on a waveguide both
     occludes the photo and costs power on every lit pixel, so
     the HUD appears on interaction and fades once the wearer is
     just looking. Arrows are drawn ONLY in the directions that
     will actually do something, which turns them into a
     position readout too: no left chevron means first photo.
     ========================================================== */
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;             /* no pointer exists on-device */
    opacity: 0;
    transition: opacity 260ms ease;
  }
  #hud.show { opacity: 1; }

  .arrow {
    position: absolute;
    width: 40px;
    height: 40px;
    display: none;                    /* JS opts each direction in */
  }
  .arrow.on { display: block; }
  .arrow svg { display: block; width: 100%; height: 100%; }

  /* Stroke, not fill: a hairline outline survives the waveguide's
     midtone washout better than a solid glyph, and the doubled
     dark drop-shadow keeps it legible over a blown-out sky. */
  .arrow path {
    fill: none;
    stroke: #fff;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.9))
            drop-shadow(0 0 9px rgba(0, 0, 0, 0.55));
  }

  /* One glyph authored pointing right, then rotated into place —
     the four arrows can never drift out of sync. */
  .arrow[data-dir="right"] { right: 10px; top: 50%;    transform: translateY(-50%); }
  .arrow[data-dir="left"]  { left: 10px;  top: 50%;    transform: translateY(-50%) rotate(180deg); }
  .arrow[data-dir="down"]  { bottom: 10px; left: 50%;  transform: translateX(-50%) rotate(90deg); }
  .arrow[data-dir="up"]    { top: 10px;   left: 50%;   transform: translateX(-50%) rotate(-90deg); }

  /* BROWSE shows a bare chevron (discrete step to the next photo);
     ZOOMED shows a shafted arrow (continuous glide across one
     photo). The mode is legible before you commit to a swipe. */
  .g-pan { display: none; }
  #hud.zoomed .g-page { display: none; }
  #hud.zoomed .g-pan  { display: inline; }

  /* Up means "open the menu" in BROWSE, not "previous photo", so it
     carries its own glyph — a chevron there would promise paging that
     no longer happens. Three dots are deliberate: the arrow box is
     rotated -90deg, and a row of dots rotates into a column of dots,
     which reads as a menu either way. A bar glyph would not survive
     the rotation. */
  .g-menu { display: none; stroke-width: 3.2; }
  #hud:not(.zoomed) .arrow[data-dir="up"] .g-page { display: none; }
  #hud:not(.zoomed) .arrow[data-dir="up"] .g-menu { display: inline; }

  /* Build stamp. Small and dim, but always present while the HUD is up:
     without it, "it still does X" is unanswerable — a stale page and a
     genuine bug look identical from a description. */
  #build {
    position: absolute;
    left: 15px;
    bottom: 13px;
    font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.5);
    text-shadow: 0 0 3px rgba(0, 0, 0, 0.95);
  }

  #counter, #zoombadge {
    position: absolute;
    top: 13px;
    font: 500 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.08em;
    color: #fff;
    text-shadow: 0 0 3px rgba(0, 0, 0, 0.95), 0 0 9px rgba(0, 0, 0, 0.6);
  }
  #counter   { left: 15px; }
  #zoombadge { right: 15px; display: none; }
  #hud.zoomed #zoombadge { display: block; }

  /* Zoom confirmation. Centred and short-lived: the wearer needs to
     know which way the ladder just moved, because one gesture drives
     both directions. Text only, no plate behind it — a filled panel
     would light pixels across the middle of the photo. */
  #zoomflash {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font: 600 46px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.06em;
    color: #fff;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 200ms ease;
    text-shadow: 0 0 4px rgba(0, 0, 0, 0.95), 0 0 14px rgba(0, 0, 0, 0.7);
  }
  #zoomflash.show  { opacity: 1; }
  #zoomflash.limit { color: #ffcf8a; }   /* amber: end of the ladder */

  /* ==========================================================
     MENU
     ----------------------------------------------------------
     The scrim is near-opaque black on purpose. An unlit pixel on
     the waveguide is transparent, so painting black over the photo
     both hides it and turns those pixels off — the legible option
     here is also the low-power one.
     ========================================================== */
  #menu {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.9);
    font: 500 23px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.03em;
  }
  #menu.open { display: flex; }

  #menu .title {
    font-size: 13px;
    letter-spacing: 0.22em;
    color: #6b6b73;
    margin-bottom: 20px;
  }

  /* Unselected rows sit dim so the highlighted one is unmistakable
     at a glance — there is no cursor to look for. */
  #menu .row {
    padding: 11px 18px;
    color: #7c7c86;
    white-space: nowrap;
  }
  #menu .row.sel {
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
  }
  /* Destructive rows only turn red once highlighted: red-by-default
     would draw the eye straight to the one row that cannot be undone. */
  #menu .row.danger.sel { color: #ff6b6b; }

  /* ==========================================================
     TEXT READER
     ----------------------------------------------------------
     Shows the OCR text Lawrence stored alongside the photo. Same
     near-opaque black as the menu: on the waveguide an unlit pixel
     is transparent, so painting black both hides the photo behind
     and costs nothing to light.

     Paging works by translating #textbody inside a fixed-height
     #textpane rather than by chunking the string. The window IS the
     page, so a page break can never land mid-line and the layout
     stays correct at any font size or text length.
     ========================================================== */
  #textreader {
    position: absolute;
    inset: 0;
    display: none;
    background: rgba(0, 0, 0, 0.93);
    padding: 26px 30px 46px;
    box-sizing: border-box;
  }
  #textreader.open { display: block; }

  #textpane {
    position: relative;
    height: 100%;
    overflow: hidden;          /* the clipping window paging is defined against */
  }

  #textbody {
    font: 400 19px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f2f2f4;
    white-space: pre-wrap;     /* OCR keeps its line breaks */
    word-break: break-word;    /* a long URL must not push the column sideways */
    will-change: transform;
  }

  /* Sits below the pane, outside the clip, so it never scrolls away. */
  #textmeta {
    position: absolute;
    left: 30px;
    right: 30px;
    bottom: 16px;
    display: flex;
    justify-content: space-between;
    font: 500 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.1em;
    color: #7c7c86;
  }

  /* Only with ?debug=1 — prints raw key names so the wearer can find
     out what a given gesture actually emits on real hardware. */
  #debug {
    position: absolute;
    left: 10px;
    bottom: 10px;
    display: none;
    font: 400 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #7fe08a;
    white-space: pre;
    text-shadow: 0 0 3px rgba(0, 0, 0, 0.95);
  }
</style>

<!-- Script order matches index.html exactly:
     config.js  ->  Supabase UMD build  ->  this page's app code. -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="stage">
    <img id="photo" alt="">
    <div id="overlay"></div>

    <!-- Both glyphs ship in every arrow; CSS reveals the one matching
         the current mode, so switching modes costs no DOM work. -->
    <div id="hud" aria-hidden="true">
      <div class="arrow" data-dir="up">
        <svg viewBox="0 0 24 24"><path class="g-page" d="M9 4.5 16.5 12 9 19.5"/><path class="g-pan" d="M4 12h14.5m-6-6 6 6-6 6"/><path class="g-menu" d="M6 12h.01M12 12h.01M18 12h.01"/></svg>
      </div>
      <div class="arrow" data-dir="down">
        <svg viewBox="0 0 24 24"><path class="g-page" d="M9 4.5 16.5 12 9 19.5"/><path class="g-pan" d="M4 12h14.5m-6-6 6 6-6 6"/></svg>
      </div>
      <div class="arrow" data-dir="left">
        <svg viewBox="0 0 24 24"><path class="g-page" d="M9 4.5 16.5 12 9 19.5"/><path class="g-pan" d="M4 12h14.5m-6-6 6 6-6 6"/></svg>
      </div>
      <div class="arrow" data-dir="right">
        <svg viewBox="0 0 24 24"><path class="g-page" d="M9 4.5 16.5 12 9 19.5"/><path class="g-pan" d="M4 12h14.5m-6-6 6 6-6 6"/></svg>
      </div>
      <div id="counter"></div>
      <div id="zoombadge"></div>
      <div id="build"></div>
    </div>

    <!-- Outside #hud: zoom feedback must not inherit the HUD's idle
         fade, and must show even after the arrows have gone. -->
    <div id="zoomflash"></div>
    <div id="menu" aria-hidden="true"></div>

    <div id="textreader" aria-hidden="true">
      <div id="textpane"><div id="textbody"></div></div>
      <div id="textmeta"><span id="textpage"></span><span>PINCH TO CLOSE</span></div>
    </div>

    <div id="debug"></div>
  </div>

<script>
(function () {
  "use strict";

  /* ============================================================
     CONSTANTS
     ============================================================ */

  // Must equal #stage's CSS width/height. The clamp formula is
  // expressed against this clipping window.
  const VIEWPORT_W = 600;
  const VIEWPORT_H = 600;

  const ZOOM_LADDER = [1, 1.5, 2.5, 4];

  // Screen-space pixels travelled per directional press at scale 1.
  // The effective step is PAN_STEP_BASE * (1 / zoomScale), so the
  // step shrinks as you zoom in (per spec: finer control at higher
  // magnification). 200 keeps 1.5x within ~1 press of its limit
  // while leaving 4x precise enough to inspect detail.
  const PAN_STEP_BASE = 200;

  // Hardware bounce suppression: a keydown arriving less than this
  // long after the last *processed* one is dropped outright.
  const INPUT_DEBOUNCE_MS = 150;

  // How long the swipe arrows linger after the last action before
  // fading out, leaving the photo unobstructed. Set to 0 to pin the
  // HUD on permanently.
  const HUD_IDLE_MS = 2600;

  // The gallery's first paint holds the arrows longer, so the swipe
  // affordance registers before it disappears.
  const HUD_INTRO_MS = 5200;

  // How long the +/- zoom confirmation stays up.
  const ZOOM_FLASH_MS = 950;

  // The glasses expose a D-pad only: four arrows plus Enter reach the
  // page, and nothing else does (Meta's Web App docs — the band's
  // twist/rotate is a system gesture that never arrives here). With a
  // single key driving zoom, a ladder that only ever climbed and then
  // snapped 4x -> 1x left no way to step back down. It now reverses at
  // each end instead: 1 -> 1.5 -> 2.5 -> 4 -> 2.5 -> 1.5 -> 1 -> ...
  // so the same pinch walks both directions, and the +/- flash says
  // which way it is heading. Set false to restore the wrapping cycle.
  const ZOOM_PING_PONG = true;

  // ?debug=1 prints every key the page receives, bound or not.
  const DEBUG = /[?&]debug=1(&|$)/.test(window.location.search);

  // Bump on every deploy that changes behaviour. Shown in the HUD so a
  // report of "it still does X" can be tied to a specific build rather
  // than guessed at — a stale page and a real bug read identically from
  // a description otherwise.
  const BUILD = "b12";

  // Days a photo sits in the bin before it is purged for good.
  const BIN_RETENTION_DAYS = 7;

  // Two-tier image loading. The stage is 600px, so 800 already oversamples
  // what the lens can resolve at 1x — it is fetched for every page and keeps
  // paging near-instant. The 2048 tier only exists to survive the 4x zoom
  // ladder (600 x 4 = 2400), and is fetched ONLY if the wearer actually
  // zooms, so browsing never pays for detail nobody looked at.
  const BROWSE_WIDTH = 800;
  // 2048 was chosen for 600 x 4 = 2400 of zoom headroom, but most sources
  // in this gallery are only ~1100px wide, so the transform was upscaling:
  // no new detail, and a 2048x2560 bitmap costs ~21MB of decoded memory on
  // a device that has very little. 1600 halves that and still resolves more
  // than the browse tier, which is the only thing the zoom step has to do.
  const ZOOM_WIDTH = 1600;
  const TRANSFORM_QUALITY = 72;

  // The menu opens on a single UP swipe. It was a double pinch, which
  // proved unreliable on hardware: the band emits keydown only, never
  // keyup, so a press has no measurable duration, and detecting a
  // "double" anything needs a timing window that EMG gesture latency
  // kept falling outside of. Worse, it competed with the pinch used to
  // zoom. Once left/right owned paging the vertical axis was free, and
  // a single swipe with no window has no timing to get wrong.

  // Contrast boost for the waveguide, which washes out midtones in
  // ambient light. 1.35 visibly separates midtones while staying
  // under the ~1.5 point where speculars clip to flat white; the
  // slight saturation lift compensates for the perceptual desaturation
  // that raising contrast alone causes.
  const CONTRAST_FILTER = "contrast(1.35) saturate(1.08)";

  const BUCKET = window.SUPABASE_BUCKET || "lens";

  const APP = {
    LOADING: "LOADING",
    ERROR:   "ERROR",
    EMPTY:   "EMPTY",
    READY:   "READY"
  };

  /* ============================================================
     STATE  —  single source of truth
     ============================================================ */

  let appState = APP.LOADING;
  let photos   = [];
  let errorText = "";

  // Which gallery is on screen. The bin is the same viewer over a
  // different query — same paging, zoom, pan and HUD.
  let collection = "live";          // "live" | "bin"

  // False once a query proves the deleted_at column is missing, i.e.
  // the migration has not been run. Everything bin-related then hides
  // itself and the viewer behaves exactly as it did before.
  let binSupported = true;

  let menuOpen  = false;
  let menuIndex = 0;
  let menuRows  = [];

  // Text reader. `textPages` is derived from measured height on open, so it
  // is only meaningful while the reader is up.
  let textOpen  = false;
  let textPage  = 0;
  let textPages = 1;
  let textLabel = "TEXT";      // names what the pane is currently showing

  // READY-only viewport state.
  let pageIndex  = 0;
  let zoomScale  = 1;
  let panX       = 0;
  let panY       = 0;
  let contrastOn = false;

  // `mode` is DERIVED, never stored — the two can therefore never
  // disagree, which removes the whole class of input/visual desync
  // bugs that a separately-tracked mode flag invites.
  const mode = () => (zoomScale === 1 ? "BROWSE" : "ZOOMED");

  // On-screen size of the current image's painted pixels at scale 1,
  // i.e. after object-fit:contain letterboxing. Known only once the
  // image has loaded; 0 until then, which safely forces maxPan = 0.
  let renderedW = 0;
  let renderedH = 0;

  let client = null;
  let lastActionAt = 0;

  // index -> Image. Holds ONLY pageIndex-1 and pageIndex+1.
  const prefetch = new Map();

  const photoEl   = document.getElementById("photo");
  const overlayEl = document.getElementById("overlay");
  const hudEl     = document.getElementById("hud");
  const counterEl = document.getElementById("counter");
  const zoomEl    = document.getElementById("zoombadge");
  const arrowEls  = {
    up:    document.querySelector('.arrow[data-dir="up"]'),
    down:  document.querySelector('.arrow[data-dir="down"]'),
    left:  document.querySelector('.arrow[data-dir="left"]'),
    right: document.querySelector('.arrow[data-dir="right"]')
  };

  document.getElementById("build").textContent = BUILD;

  const flashEl = document.getElementById("zoomflash");
  const menuEl  = document.getElementById("menu");
  const readerEl   = document.getElementById("textreader");
  const paneEl     = document.getElementById("textpane");
  const textBodyEl = document.getElementById("textbody");
  const textPageEl = document.getElementById("textpage");
  const debugEl = document.getElementById("debug");

  let hudTimer   = null;
  let flashTimer = null;
  const debugLines = [];

  // Which way the next Enter walks the zoom ladder. Flips on reaching
  // either end; reset to "in" whenever the viewport resets.
  let zoomDir = +1;

  /* ============================================================
     SUPABASE
     ============================================================ */

  // Matches index.html's init pattern. The resulting client is also
  // published as window.supabaseClient so hardware/host integrations
  // can reach it, and is reused if something already defined it.
  function getClient() {
    if (client) return client;

    if (window.supabaseClient) {
      client = window.supabaseClient;
      return client;
    }
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      throw new Error("Supabase library failed to load.");
    }
    const url = window.SUPABASE_URL;
    const key = window.SUPABASE_ANON_KEY;
    if (!url || !key) {
      throw new Error("config.js is missing SUPABASE_URL or SUPABASE_ANON_KEY.");
    }
    // config.js ships with placeholders; fail loudly rather than
    // emitting an opaque DNS error from a bogus hostname.
    if (url.includes("YOUR-PROJECT-REF") || key.includes("YOUR-ANON")) {
      throw new Error("config.js still has placeholder credentials.");
    }
    client = window.supabase.createClient(url, key);
    window.supabaseClient = client;
    return client;
  }

  // Served through Supabase's image transform endpoint rather than the raw
  // object. The stored master is several MB; the stage is 600px, so fetching
  // the original meant downloading 20-50x more image than a lens pixel can
  // ever show. The transform also negotiates WebP off the browser's Accept
  // header, which is most of the saving.
  //
  // Transforms are derived from the stored original, so this costs no
  // re-upload and applies to photos that are already in the gallery.
  function urlFor(photo, width) {
    return getClient().storage.from(BUCKET).getPublicUrl(photo.storage_path, {
      transform: {
        width: width || BROWSE_WIDTH,
        quality: TRANSFORM_QUALITY,
        resize: "contain"       // never crop; letterboxing is the img's job
      }
    }).data.publicUrl;
  }

  // A pre-migration database has no deleted_at column. Rather than
  // fail, the viewer detects that once and falls back to its previous
  // unfiltered behaviour, so this can be deployed before the SQL is
  // run without the glasses showing an error.
  function isMissingDeletedAt(error) {
    const blob = ((error && error.message) || "") + " " +
                 ((error && error.code) || "") + " " +
                 ((error && error.details) || "");
    const s = blob.toLowerCase();
    return s.indexOf("deleted_at") !== -1 ||
           s.indexOf("ocr_text") !== -1 ||
           s.indexOf("summary") !== -1 ||
           s.indexOf("42703") !== -1;     // undefined_column
  }

  async function fetchCollection() {
    const c = getClient();

    // "order" is a reserved SQL word: quoted in the column list and in
    // .order() because both are identifier positions. deleted_at is an
    // ordinary identifier and needs no quoting.
    if (binSupported) {
      // ocr_text rides along with the bin columns: both arrived in the same
      // migration, so if one is missing the fallback below covers both and
      // the reader simply never offers itself.
      let q = c.from("photos")
               .select('id, storage_path, "order", display_name, deleted_at, ocr_text, summary');
      q = (collection === "bin") ? q.not("deleted_at", "is", null)
                                 : q.is("deleted_at", null);
      const { data, error } = await q.order('"order"', { ascending: true });
      if (!error) return Array.isArray(data) ? data : [];
      if (!isMissingDeletedAt(error)) {
        throw new Error(error.message || "Supabase returned an error.");
      }
      binSupported = false;         // migration not run yet
      collection = "live";
    }

    const { data, error } = await c.from("photos")
      .select('id, storage_path, "order", display_name')
      .order('"order"', { ascending: true });
    if (error) throw new Error(error.message || "Supabase returned an error.");
    return Array.isArray(data) ? data : [];
  }

  // Housekeeping, not a feature: sweeps anything that has sat in the
  // bin past its retention window. Runs lazily on load rather than on
  // a schedule — no cron, no server, and for a personal gallery
  // "whenever you open it" is often enough. Deliberately fire and
  // forget: the gallery must never wait on it, and a failure here
  // must never surface as a gallery error.
  async function purgeExpired() {
    try {
      const c = getClient();
      const cutoff = new Date(Date.now() - BIN_RETENTION_DAYS * 86400000).toISOString();
      const { data, error } = await c.from("photos")
        .select("id, storage_path")
        .not("deleted_at", "is", null)
        .lt("deleted_at", cutoff);
      if (error || !data || data.length === 0) return;

      // Storage object first: a removed row would orphan the file with
      // nothing left pointing at it.
      await c.storage.from(BUCKET).remove(data.map(function (p) { return p.storage_path; }));
      await c.from("photos").delete().in("id", data.map(function (p) { return p.id; }));
    } catch (ignored) { /* housekeeping never blocks the viewer */ }
  }

  async function loadGallery() {
    appState = APP.LOADING;
    errorText = "";
    closeMenuSilently();
    // Switching collections replaces `photos` wholesale, so text still on
    // screen would belong to a row that is no longer at this index.
    closeTextReaderSilently();
    render();

    try {
      photos = await fetchCollection();

      if (binSupported && collection === "live") purgeExpired();

      if (photos.length === 0) {
        clearPrefetch();
        appState = APP.EMPTY;
        render();
        return;
      }

      // contrastOn deliberately survives a reload — it is a viewing
      // preference, not gallery state.
      pageIndex = 0;
      resetViewport();
      appState = APP.READY;
      showCurrentPage();
      bumpHud(HUD_INTRO_MS);   // hold the affordance longer on first paint

    } catch (err) {
      clearPrefetch();
      errorText = (err && err.message) ? err.message : String(err);
      appState = APP.ERROR;
      render();
    }
  }

  /* ============================================================
     VIEWPORT MATH
     ============================================================ */

  function resetViewport() {
    zoomScale = 1;
    panX = 0;
    panY = 0;
    zoomDir = +1;        // a fresh photo always zooms in first
  }

  // Recomputed on every image load: the contain-fit of the natural
  // image into the 600x600 box.
  function measureRendered() {
    const nW = photoEl.naturalWidth;
    const nH = photoEl.naturalHeight;
    if (!nW || !nH) { renderedW = 0; renderedH = 0; return; }
    const fit = Math.min(VIEWPORT_W / nW, VIEWPORT_H / nH);
    renderedW = nW * fit;
    renderedH = nH * fit;
  }

  // Clamp pan to the scaled image's overflow beyond the viewport,
  // independently per axis. An axis whose scaled extent still fits
  // inside the viewport has maxPan 0 and is pinned to centre — there
  // is nothing off-screen to reveal on it.
  // Single source of truth for the bounds: the clamp and the HUD's
  // "is there anything left that way?" test read the same numbers,
  // so an arrow can never point somewhere the clamp refuses to go.
  function panLimits() {
    return {
      x: Math.max(0, (renderedW * zoomScale - VIEWPORT_W) / 2),
      y: Math.max(0, (renderedH * zoomScale - VIEWPORT_H) / 2)
    };
  }

  function clampPan() {
    const lim = panLimits();
    panX = Math.min(lim.x, Math.max(-lim.x, panX));
    panY = Math.min(lim.y, Math.max(-lim.y, panY));
  }

  // translate BEFORE scale: CSS applies the translation in the
  // parent's coordinate space, unmultiplied by the scale. panX/panY
  // are therefore plain screen pixels — the same space the clamp
  // bounds above are computed in.
  function applyTransform() {
    photoEl.style.transform = "translate(" + panX + "px, " + panY + "px) scale(" + zoomScale + ")";
  }

  function applyContrast() {
    photoEl.style.filter = contrastOn ? CONTRAST_FILTER : "none";
  }

  /* ============================================================
     PAGING + PREFETCH
     ============================================================ */

  function clearPrefetch() {
    prefetch.forEach(function (img) { img.src = ""; });
    prefetch.clear();
  }

  // Memory isolation: warm ONLY the immediate neighbours, and drop
  // references to everything else so the tab's image cache stays
  // bounded regardless of gallery size.
  function updatePrefetchWindow() {
    const wanted = new Set();
    [pageIndex - 1, pageIndex + 1].forEach(function (i) {
      if (i >= 0 && i < photos.length) wanted.add(i);
    });

    prefetch.forEach(function (img, i) {
      if (!wanted.has(i)) {
        img.src = "";
        prefetch.delete(i);
      }
    });

    wanted.forEach(function (i) {
      if (prefetch.has(i)) return;
      const img = new Image();
      img.decoding = "async";
      img.src = urlFor(photos[i]);
      prefetch.set(i, img);
    });
  }

  /* ---------- zoom tier ----------
     The high-resolution copy is fetched lazily, off-screen, and only swapped
     in once it has fully decoded — assigning it to the live <img> directly
     would blank the photo mid-zoom while it downloaded. */

  let hiResFor = -1;          // page index whose hi-res copy is loaded/loading
  let hiResLoader = null;     // in-flight loader; identity guards a stale swap
  let imageRetries = 0;       // per-page, reset on every page change

  function dropHiRes() {
    if (hiResLoader) { hiResLoader.src = ""; hiResLoader = null; }
    hiResFor = -1;
  }

  /// Confirms the browse-tier frame actually decoded, and escalates to the
  /// larger tier if it did not.
  ///
  /// One photo renders solid black on the glasses at 800px while the very
  /// same photo at 1600px is perfect, and its bytes are structurally
  /// identical to neighbours that work — same VP8X WebP, same 800x1000
  /// output, byte-identical EXIF. So it cannot be predicted from the file,
  /// and the device's decoder is simply failing on that particular encode.
  ///
  /// decode() is the API built for exactly this: it settles only once the
  /// frame is genuinely ready to paint, and rejects when the decoder gives
  /// up — a failure that `load` reports as success. It is also why the zoom
  /// tier already works: that path decodes off-screen before it is shown.
  function verifyDecode(photo, index) {
    if (!photoEl.decode) return;              // older engines: nothing to do
    photoEl.decode().catch(function () {
      // Paging away mid-decode makes this answer irrelevant.
      if (index !== pageIndex || appState !== APP.READY) return;
      debugNote("browse-tier decode failed — escalating");
      requestHiRes();
    });
  }

  function requestHiRes() {
    if (appState !== APP.READY) return;
    if (hiResFor === pageIndex) return;      // already have it, or fetching it
    const photo = photos[pageIndex];
    if (!photo) return;

    hiResFor = pageIndex;
    const wanted = pageIndex;
    const url = urlFor(photo, ZOOM_WIDTH);

    const loader = new Image();
    loader.decoding = "async";
    hiResLoader = loader;
    loader.onload = function () {
      // Paging away mid-flight must not slam a stale photo onto the screen.
      if (loader !== hiResLoader || wanted !== pageIndex) return;
      hiResLoader = null;
      // Same displayed geometry, more pixels: the load handler re-measures,
      // and pan stays clamped because the rendered box is unchanged.
      photoEl.src = url;
    };
    loader.onerror = function () {
      // Losing the upgrade is not worth breaking the page over — the browse
      // tier is already on screen and perfectly usable.
      if (loader === hiResLoader) hiResLoader = null;
      if (wanted === hiResFor) hiResFor = -1;   // let a later zoom retry
    };
    loader.src = url;
  }

  function showCurrentPage() {
    const photo = photos[pageIndex];

    // Dimensions are unknown until the new image loads; zeroing them
    // holds maxPan at 0 so no stale bound from the previous photo can
    // leak through.
    renderedW = 0;
    renderedH = 0;
    imageRetries = 0;            // the budget is per photo, not per session
    dropHiRes();                 // new page starts back on the browse tier

    photoEl.alt = photo.display_name || "";
    photoEl.src = urlFor(photo, BROWSE_WIDTH);
    verifyDecode(photo, pageIndex);

    applyTransform();
    applyContrast();
    updatePrefetchWindow();
    render();
  }

  photoEl.addEventListener("load", function () {
    // A decode that ran out of memory still fires `load` — just with zero
    // natural dimensions. Without this check the element renders as a
    // silent black rectangle, the error handler never runs, and there is
    // nothing on screen to say anything went wrong.
    if (!photoEl.naturalWidth || !photoEl.naturalHeight) {
      imageFailed("decoded empty");
      return;
    }
    imageRetries = 0;
    measureRendered();
    clampPan();
    applyTransform();
    if (appState === APP.READY) render();
  });

  photoEl.addEventListener("error", function () {
    imageFailed("load error");
  });

  // Objects are served no-cache, so every view is a fresh download over
  // the glasses' link. A truncated body decodes to nothing rather than
  // raising, so one silent retry is worth more than an immediate failure.
  function imageFailed(reason) {
    renderedW = 0;
    renderedH = 0;
    if (appState !== APP.READY) return;

    const photo = photos[pageIndex];
    if (photo && imageRetries < 1) {
      imageRetries += 1;
      debugNote("image " + reason + " — retrying");
      // Cache-buster: without it a wedged intermediary can hand back the
      // same broken body forever.
      photoEl.src = urlFor(photo, BROWSE_WIDTH) + "&r=" + Date.now();
      return;
    }

    // A single unreachable object must not break the state machine:
    // stay in READY so the wearer can navigate off the bad page. Naming
    // the reason turns a black screen into something diagnosable.
    showOverlay("Image unavailable (" + reason + ")\n" +
                (pageIndex + 1) + " / " + photos.length, false);
    photoEl.style.display = "none";
    bumpHud();               // show the way out of a broken page
  }

  /* ============================================================
     TRANSITIONS
     ============================================================ */

  function changePage(delta) {
    const next = Math.min(photos.length - 1, Math.max(0, pageIndex + delta));
    if (next === pageIndex) return false;        // hard clamp, no wraparound
    pageIndex = next;
    resetViewport();                             // page change always returns to BROWSE
    showCurrentPage();
    return true;
  }

  // Every zoom path funnels through here, so the ladder cycle and the
  // discrete out-step can never leave different state behind.
  function commitZoom(nextScale) {
    const prev = zoomScale;
    zoomScale = nextScale;
    if (zoomScale === 1) { panX = 0; panY = 0; }   // back to BROWSE
    clampPan();
    applyTransform();
    flashZoom(nextScale > prev ? +1 : -1, false);
    // The moment magnification is asked for, the browse tier stops being
    // enough. Fetched here rather than on every page so a wearer who never
    // zooms never downloads it.
    if (zoomScale > 1) requestHiRes();
    render();
    return true;
  }

  function ladderIndex() {
    const at = ZOOM_LADDER.indexOf(zoomScale);
    return at === -1 ? 0 : at;
  }

  // Enter / pinch. Walks the ladder, reversing at each end so one key
  // covers both directions (see ZOOM_PING_PONG).
  function advanceZoom() {
    const cur = ladderIndex();
    const last = ZOOM_LADDER.length - 1;

    if (!ZOOM_PING_PONG) {
      return commitZoom(ZOOM_LADDER[(cur + 1) % ZOOM_LADDER.length]);
    }

    let next = cur + zoomDir;
    if (next > last)      { zoomDir = -1; next = cur - 1; }   // bounce off 4x
    else if (next < 0)    { zoomDir = +1; next = cur + 1; }   // bounce off 1x
    if (next === cur) return false;                           // 1-rung ladder
    return commitZoom(ZOOM_LADDER[next]);
  }

  // An explicit "step out" for hosts that can deliver a second key.
  // Clamps at 1x rather than wrapping: a dedicated out control that
  // jumped to maximum zoom would be a nasty surprise.
  function zoomOut() {
    const cur = ladderIndex();
    if (cur === 0) { flashZoom(-1, true); return false; }
    zoomDir = -1;                    // keep the pinch walking the same way
    return commitZoom(ZOOM_LADDER[cur - 1]);
  }

  function zoomIn() {
    const cur = ladderIndex();
    if (cur === ZOOM_LADDER.length - 1) { flashZoom(+1, true); return false; }
    zoomDir = +1;
    return commitZoom(ZOOM_LADDER[cur + 1]);
  }

  function panBy(dirX, dirY) {
    const step = PAN_STEP_BASE * (1 / zoomScale);
    panX += dirX * step;
    panY += dirY * step;
    clampPan();
    applyTransform();
    return true;
  }

  function toggleContrast() {
    contrastOn = !contrastOn;
    applyContrast();
    return true;
  }

  function resetViewportAction() {
    resetViewport();                              // pageIndex and contrastOn untouched
    clampPan();
    applyTransform();
    render();
    return true;
  }

  /* ============================================================
     MENU
     ============================================================ */

  function buildMenuRows() {
    const rows = [];
    if (collection === "live") {
      // Offered only when this photo actually carries text, so the row is
      // never a dead end. Photos uploaded before Lawrence existed, and any
      // Vision found nothing in, simply do not show it.
      if (currentText()) {
        rows.push({
          label: "Read text",
          run: function () { return openTextReader(currentText(), "TEXT"); }
        });
        // Two labels, not one: a cached summary opens instantly and costs
        // nothing, while generating one is a paid round trip. The wearer
        // should be able to tell which they are about to do.
        rows.push(summaryOf(photos[pageIndex])
          ? { label: "Read summary", run: readSummary }
          : { label: "Summarize",    run: requestSummary });
      }
      // Both entries depend on the migration; without it the menu is
      // just Cancel, which is honest rather than offering a dead action.
      if (binSupported) {
        rows.push({ label: "Delete photo",   danger: true,  run: sendToBin });
        rows.push({ label: "Recycle bin",    run: openBin });
      }
    } else {
      rows.push({ label: "Restore photo",    run: restorePhoto });
      rows.push({ label: "Delete forever",   danger: true,  run: deleteForever });
      rows.push({ label: "Back to photos",   run: backToLive });
    }
    rows.push({ label: "Cancel", run: closeMenu });
    return rows;
  }

  function openMenu() {
    menuRows = buildMenuRows();
    // Cancel is last and starts selected: on a display where you cannot
    // see precisely what is highlighted, a stray extra pinch should do
    // nothing rather than delete a photo.
    menuIndex = menuRows.length - 1;
    menuOpen = true;
    hudEl.classList.remove("show");
    if (hudTimer) { clearTimeout(hudTimer); hudTimer = null; }
    render();
    return true;
  }

  function closeMenuSilently() {
    menuOpen = false;
    menuEl.classList.remove("open");
  }

  function closeMenu() {
    closeMenuSilently();
    render();
    bumpHud();
    return true;
  }

  function moveMenu(delta) {
    if (menuRows.length === 0) return false;
    menuIndex = (menuIndex + delta + menuRows.length) % menuRows.length;
    renderMenu();
    return true;
  }

  function renderMenu() {
    if (!menuOpen) { menuEl.classList.remove("open"); return; }
    let html = '<div class="title">' +
               (collection === "bin" ? "RECYCLE BIN" : "PHOTO") + "</div>";
    for (let i = 0; i < menuRows.length; i++) {
      const row = menuRows[i];
      html += '<div class="row' +
              (i === menuIndex ? " sel" : "") +
              (row.danger ? " danger" : "") + '">' +
              escapeText(row.label) + "</div>";
    }
    menuEl.innerHTML = html;
    menuEl.classList.add("open");
  }

  function escapeText(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- menu actions ---------- */

  // Drops the photo currently on screen out of the loaded gallery and
  // settles the viewer on a sensible neighbour, without a refetch.
  function dropCurrentFromView() {
    photos.splice(pageIndex, 1);
    clearPrefetch();
    if (photos.length === 0) {
      appState = APP.EMPTY;
      render();
      return;
    }
    if (pageIndex > photos.length - 1) pageIndex = photos.length - 1;
    resetViewport();
    showCurrentPage();
    bumpHud();
  }

  async function withCurrentPhoto(busyText, work) {
    const photo = photos[pageIndex];
    if (!photo) return closeMenu();
    closeMenuSilently();
    showOverlay(busyText, false);
    photoEl.style.display = "none";
    try {
      await work(photo, getClient());
      dropCurrentFromView();
    } catch (err) {
      errorText = (err && err.message) ? err.message : String(err);
      appState = APP.ERROR;
      render();
    }
    return true;
  }

  function sendToBin() {
    return withCurrentPhoto("Moving to bin…", async function (photo, c) {
      const { error } = await c.from("photos")
        .update({ deleted_at: new Date().toISOString() })
        .eq("id", photo.id);
      if (error) throw new Error(error.message);
    });
  }

  function restorePhoto() {
    return withCurrentPhoto("Restoring…", async function (photo, c) {
      const { error } = await c.from("photos")
        .update({ deleted_at: null })
        .eq("id", photo.id);
      if (error) throw new Error(error.message);
    });
  }

  function deleteForever() {
    return withCurrentPhoto("Deleting…", async function (photo, c) {
      // Storage object first, then the row: the reverse order would
      // orphan the file with nothing left pointing at it.
      const rm = await c.storage.from(BUCKET).remove([photo.storage_path]);
      if (rm.error) throw new Error(rm.error.message);
      const { error } = await c.from("photos").delete().eq("id", photo.id);
      if (error) throw new Error(error.message);
    });
  }

  function openBin()    { collection = "bin";  loadGallery(); return true; }
  function backToLive() { collection = "live"; loadGallery(); return true; }

  /* ============================================================
     TEXT READER
     ============================================================
     Displays the OCR text Lawrence extracted at upload. Nothing is
     recognised here — the web side never runs OCR; it only renders what
     is already on the row. */

  /// Trimmed text for a photo, or "" when there is none to show. Rows that
  /// predate the OCR columns simply have no field, which reads as empty.
  function textOf(photo) {
    return (photo && typeof photo.ocr_text === "string")
      ? photo.ocr_text.trim()
      : "";
  }

  function currentText() {
    return textOf(photos[pageIndex]);
  }

  /// Opens the reader on arbitrary text. `label` names what is being read,
  /// since the same pane now serves both the raw OCR and its summary and
  /// they would otherwise be indistinguishable.
  function openTextReader(body, label) {
    body = (body || "").trim();
    if (!body) return false;               // menu hides the row, but be safe

    closeMenuSilently();
    textLabel = label || "TEXT";
    textBodyEl.textContent = body;
    textOpen = true;
    textPage = 0;
    readerEl.classList.add("open");

    // Measured AFTER the reader is visible: a display:none element reports
    // zero height, which would collapse every text to a single page.
    const windowHeight = paneEl.clientHeight || 1;
    textPages = Math.max(1, Math.ceil(textBodyEl.scrollHeight / windowHeight));

    hudEl.classList.remove("show");
    if (hudTimer) { clearTimeout(hudTimer); hudTimer = null; }
    renderTextReader();
    return true;
  }

  /// Tears the reader down without re-rendering. For callers that are about
  /// to redraw everything anyway, or are leaving READY entirely.
  function closeTextReaderSilently() {
    textOpen = false;
    textPage = 0;
    readerEl.classList.remove("open");
    textBodyEl.style.transform = "";
    textBodyEl.textContent = "";           // release the string with the view
  }

  function closeTextReader() {
    closeTextReaderSilently();
    render();
    bumpHud();
    return true;
  }

  /* ---------- summary ---------- */

  function summaryOf(photo) {
    return (photo && typeof photo.summary === "string")
      ? photo.summary.trim()
      : "";
  }

  function readSummary() {
    return openTextReader(summaryOf(photos[pageIndex]), "SUMMARY");
  }

  /// Asks the server to summarize this photo's stored text. The Groq key
  /// lives only in that function's environment — the viewer is public, so
  /// it can never hold one. The result is cached onto the row server-side,
  /// so this is paid for once per photo, ever.
  async function requestSummary() {
    const photo = photos[pageIndex];
    if (!photo) return false;

    closeMenuSilently();
    showOverlay("Summarizing…", false);
    photoEl.style.display = "none";
    render();

    const wanted = photo.id;      // guards a reply that outlives the page
    try {
      const response = await fetch("/api/summarize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ photo_id: photo.id })
      });
      const payload = await response.json().catch(function () { return {}; });

      if (!response.ok || !payload.summary) {
        throw new Error(payload.error || ("HTTP " + response.status));
      }

      // Mirror it locally so re-opening within this session skips the round
      // trip entirely — the server already cached it to the row.
      photo.summary = payload.summary;

      // Paging away while the request was in flight means this summary is
      // no longer what is on screen; the row keeps it for next time.
      if (!photos[pageIndex] || photos[pageIndex].id !== wanted) {
        hideOverlay();
        photoEl.style.display = "block";
        render();
        return true;
      }

      hideOverlay();
      photoEl.style.display = "block";
      openTextReader(payload.summary, "SUMMARY");
      return true;
    } catch (err) {
      hideOverlay();
      photoEl.style.display = "block";
      render();
      flashProblem((err && err.message) || "Summarize failed");
      return true;
    }
  }

  /// Transient failure notice. Borrows the zoom flash rather than the
  /// ERROR state: the gallery is fine, one optional action just did not
  /// work, and dropping the wearer into a terminal screen for that would
  /// be out of proportion.
  function flashProblem(text) {
    flashEl.classList.add("limit");        // amber
    flashEl.textContent = String(text).slice(0, 42);
    flashEl.classList.add("show");
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function () {
      flashEl.classList.remove("show", "limit");
      flashTimer = null;
    }, 2600);
  }

  function pageText(delta) {
    const next = textPage + delta;
    if (next < 0 || next >= textPages) return false;   // clamp, no wraparound
    textPage = next;
    renderTextReader();
    return true;
  }

  function renderTextReader() {
    if (!textOpen) return;
    // Translating the block inside the clipping window means a page break can
    // never split a line the way a character-count chunker would.
    textBodyEl.style.transform =
      "translateY(" + (-textPage * paneEl.clientHeight) + "px)";
    textPageEl.textContent = textLabel +
      (textPages > 1 ? "  " + (textPage + 1) + " / " + textPages : "");
    updateHud();
  }

  /* ============================================================
     INPUT
     ============================================================ */

  const KEY_ACTIONS = {
    "ArrowLeft":  "LEFT",
    "ArrowRight": "RIGHT",
    "ArrowUp":    "UP",
    "ArrowDown":  "DOWN",
    "Enter":      "SELECT",
    "c":          "CONTRAST",
    "C":          "CONTRAST",
    "r":          "RESET",
    "R":          "RESET",

    // Only the arrows and Enter are guaranteed on-device. The rest are
    // for desktop testing, and are free wins if a firmware update ever
    // starts delivering them — none collides with a D-pad key.
    "Escape":     "ZOOM_OUT",
    "-":          "ZOOM_OUT",
    "_":          "ZOOM_OUT",
    "+":          "ZOOM_IN",
    "=":          "ZOOM_IN"
  };

  // The one funnel every input passes through — keyboard and the
  // programmatic window.viewer hooks alike — so debounce and state
  // gating can never be bypassed by one path. Returns whether the
  // action was actually processed.
  function dispatch(action) {
    const now = (window.performance && performance.now) ? performance.now() : Date.now();
    if (now - lastActionAt < INPUT_DEBOUNCE_MS) return false;

    // ERROR is terminal except for retry. Enter counts as well as R:
    // on the glasses R is unreachable, so an R-only retry would have
    // stranded the wearer in ERROR with no way out but restarting.
    if (appState === APP.ERROR) {
      if (action !== "RESET" && action !== "SELECT") return false;
      lastActionAt = now;
      loadGallery();
      return true;
    }

    // An empty BIN still needs a way out, or the wearer is stranded in
    // a gallery with nothing in it. An empty live gallery stays
    // terminal: there is nothing to retry into.
    if (appState === APP.EMPTY) {
      if (collection === "bin" && action === "SELECT") {
        lastActionAt = now;
        backToLive();
        return true;
      }
      return false;
    }

    if (appState !== APP.READY) return false;

    // The reader owns input while it is up: up/down turn its pages and a
    // pinch closes it. Left/right are deliberately inert — paging the photo
    // out from under the text being read would be disorienting.
    if (textOpen) {
      let ok = false;
      if (action === "UP")          ok = pageText(-1);
      else if (action === "DOWN")   ok = pageText(+1);
      else if (action === "SELECT") ok = closeTextReader();
      if (ok) lastActionAt = now;
      return ok;
    }

    // The menu owns input while it is open: arrows move the highlight
    // and never page or pan underneath it.
    if (menuOpen) {
      let ok = false;
      if (action === "UP")        ok = moveMenu(-1);
      else if (action === "DOWN") ok = moveMenu(+1);
      else if (action === "SELECT") {
        const row = menuRows[menuIndex];
        ok = row ? (row.run() !== false) : false;
      }
      if (ok) lastActionAt = now;
      return ok;
    }

    const zoomed = mode() === "ZOOMED";
    let handled = false;

    switch (action) {
      // Pan follows a "look around" model: a swipe moves the wearer's
      // viewpoint that way, so swiping left reveals what sits off the
      // left edge. Moving the view one way means translating the image
      // the other, which is why these signs oppose the direction named.
      // availableDirections() derives its bounds test from exactly
      // these signs — flip one and you must flip the other.
      case "LEFT":     handled = zoomed ? panBy(+1, 0) : changePage(-1); break;
      case "RIGHT":    handled = zoomed ? panBy(-1, 0) : changePage(+1); break;
      // In BROWSE the vertical axis is a second way to page, so a
      // swipe pages without having to find the horizontal axis first.
      // Down advances and up goes back, matching right/left. To invert,
      // swap the two changePage signs below — nothing else reads this
      // convention. In ZOOMED the axis still pans, unchanged.
      // Up opens the menu in BROWSE. Left/right own paging, which leaves
      // the vertical axis unused there — so a single swipe is already
      // unambiguous and needs no timing window. That is the whole point:
      // the double pinch it replaces failed precisely because it needed
      // one, and gesture latency on this hardware made it unreliable.
      case "UP":       handled = zoomed ? panBy(0, +1) : openMenu();     break;
      // Down stays deliberately unassigned in BROWSE, reserved.
      case "DOWN":     handled = zoomed ? panBy(0, -1) : false;          break;
      case "SELECT":   handled = advanceZoom();     break;
      case "ZOOM_IN":  handled = zoomIn();          break;
      case "ZOOM_OUT": handled = zoomOut();         break;
      case "CONTRAST": handled = toggleContrast();  break;
      case "RESET":    handled = resetViewportAction(); break;
    }

    // Only a real state change counts as "processed", so an input at
    // a clamped edge does not start a debounce window that would eat
    // the wearer's next, valid press.
    if (handled) lastActionAt = now;

    // Surface the arrows even when nothing moved: a press that hits a
    // boundary is precisely when it helps to see which ways are left.
    bumpHud();
    return handled;
  }

  window.addEventListener("keydown", function (e) {
    if (!e.repeat) {
      // Logged before the bound/unbound test on purpose: the point of
      // ?debug=1 is to reveal keys we do NOT already handle.
      debugNote((e.key === " " ? "Space" : e.key) +
                " [" + (e.code || "?") + "] " +
                (KEY_ACTIONS[e.key] ? "→ " + KEY_ACTIONS[e.key] : "unbound"));
    }

    if (e.repeat) return;                         // native key-repeat safeguard
    const action = KEY_ACTIONS[e.key];
    if (!action) return;
    e.preventDefault();
    // A pinch now means exactly one thing — walk the zoom ladder. The
    // menu moved to a swipe, so nothing competes for this gesture and
    // zooming cannot be hijacked by a mistimed second pinch.
    dispatch(action);
  });

  /* ============================================================
     HOST INTERFACE
     ============================================================
     Hooks for intercepting hardware actions directly. They route
     through the same dispatch funnel as the keys, so next()/prev()
     are mode-dependent exactly like the arrows: they page in BROWSE
     and pan horizontally in ZOOMED. Each returns true if the action
     changed state, false if it was debounced or was a no-op. */
  window.viewer = {
    next:          function () { return dispatch("RIGHT"); },
    prev:          function () { return dispatch("LEFT"); },
    toggleZoom:    function () { return dispatch("SELECT"); },
    zoomIn:        function () { return dispatch("ZOOM_IN"); },
    zoomOut:       function () { return dispatch("ZOOM_OUT"); },
    cycleContrast: function () { return dispatch("CONTRAST"); },
    // Flash the arrows without performing an action — for a host that
    // wants to surface them on, say, a wake or a raise-to-look gesture.
    showHints:     function (ms) { bumpHud(ms); }
  };

  /* ============================================================
     RENDER
     ============================================================ */

  /* ============================================================
     HUD
     ============================================================ */

  // Which of the four directions would actually do something right
  // now. In BROWSE that means "is there a photo that way"; in ZOOMED,
  // "is there image left to reveal that way" — tested against the
  // very bounds clampPan enforces, so an arrow can never promise a
  // move the clamp will refuse.
  function availableDirections() {
    if (mode() === "ZOOMED") {
      const lim = panLimits();
      // Mirrors the dispatch table under the look-around model: LEFT/UP
      // *increase* pan and RIGHT/DOWN decrease it, so each stays live
      // until it reaches its own bound. The comparison is exact on
      // purpose — clampPan pins pan to precisely +/-lim, so there is no
      // drift to absorb, and a tolerance band here would hide an arrow
      // while the press it describes still moves the image.
      return {
        left:  panX <  lim.x,
        right: panX > -lim.x,
        up:    panY <  lim.y,
        down:  panY > -lim.y
      };
    }
    // Up is always live because the menu can always open; down does
    // nothing here. Showing a chevron for either would promise paging
    // that the vertical axis no longer performs.
    const canPrev = pageIndex > 0;
    const canNext = pageIndex < photos.length - 1;
    return { left: canPrev, right: canNext, up: true, down: false };
  }

  function formatZoom(z) {
    return String(z) + "×";       // 1.5 -> "1.5×"
  }

  // The wearer's only zoom control is a single key that changes
  // direction, so the direction has to be shown, not inferred.
  // atLimit renders amber to distinguish "went out to 1x" from
  // "asked to go out, already at 1x".
  function flashZoom(dir, atLimit) {
    flashEl.textContent = (dir > 0 ? "+" : "−") + " " + formatZoom(zoomScale);
    flashEl.classList.toggle("limit", !!atLimit);
    flashEl.classList.add("show");
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function () {
      flashEl.classList.remove("show");
      flashTimer = null;
    }, ZOOM_FLASH_MS);
  }

  function debugNote(line) {
    if (!DEBUG) return;
    debugLines.push(line);
    if (debugLines.length > 9) debugLines.shift();
    debugEl.textContent = debugLines.join("\n");
    debugEl.style.display = "block";
  }

  function updateHud() {
    // The menu and reader own the screen while up — their arrows mean
    // something else entirely, so the paging affordances would be actively
    // misleading. The reader draws its own page counter instead.
    if (menuOpen || textOpen) {
      hudEl.classList.remove("show");
      return;
    }
    if (appState !== APP.READY) {
      hudEl.classList.remove("show");
      if (hudTimer) { clearTimeout(hudTimer); hudTimer = null; }
      return;
    }

    const zoomed = mode() === "ZOOMED";
    hudEl.classList.toggle("zoomed", zoomed);

    const dirs = availableDirections();
    Object.keys(arrowEls).forEach(function (d) {
      arrowEls[d].classList.toggle("on", !!dirs[d]);
    });

    // A single-photo gallery has nothing to count — but the bin always
    // labels itself, so the wearer can never mistake it for the real
    // gallery and think their photos have vanished.
    const count = (pageIndex + 1) + " / " + photos.length;
    counterEl.textContent = (collection === "bin")
      ? ("BIN " + count)
      : (photos.length > 1 ? count : "");
    zoomEl.textContent = zoomed ? formatZoom(zoomScale) : "";
  }

  // Reveal the HUD, then start its fade timer over. Called on every
  // input that clears debounce — including ones that changed nothing,
  // because a press that hits a boundary is exactly when the wearer
  // most needs to see which directions remain.
  function bumpHud(duration) {
    updateHud();
    if (appState !== APP.READY) return;

    hudEl.classList.add("show");
    if (hudTimer) clearTimeout(hudTimer);
    hudTimer = null;

    const ms = (duration === undefined) ? HUD_IDLE_MS : duration;
    if (ms > 0) {
      hudTimer = setTimeout(function () {
        hudEl.classList.remove("show");
        hudTimer = null;
      }, ms);
    }
  }

  function showOverlay(text, isError) {
    overlayEl.textContent = text;
    overlayEl.classList.add("visible");
    overlayEl.classList.toggle("error", !!isError);
  }

  function hideOverlay() {
    overlayEl.classList.remove("visible", "error");
    overlayEl.textContent = "";
  }

  function render() {
    switch (appState) {
      case APP.LOADING:
        photoEl.style.display = "none";
        showOverlay("Loading", false);
        break;

      case APP.ERROR:
        photoEl.style.display = "none";
        showOverlay("Could not load gallery\n" + errorText + "\n\nPinch to retry", true);
        break;

      case APP.EMPTY:
        photoEl.style.display = "none";
        showOverlay(collection === "bin"
          ? "Recycle bin is empty\n\nPinch to go back"
          : "No photos yet", false);
        break;

      case APP.READY:
        hideOverlay();
        photoEl.style.display = "block";
        break;
    }
    // Keeps the arrow set truthful on every state change without
    // forcing it visible; bumpHud owns visibility.
    updateHud();
    renderMenu();
  }

  render();
  loadGallery();
})();
</script>
</body>
</html>
