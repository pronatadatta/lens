<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Lens</title>

<style>
  /* ==========================================================
     Presentation layer
     ----------------------------------------------------------
     Pure black everywhere: on the Ray-Ban Display's waveguide an
     unlit pixel is transparent, so #000 costs no power and reads
     as "not there" rather than as a visible frame.
     ========================================================== */
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;                 /* no cursor exists on-device */
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* The stage is a strict 600x600 block matching the AR display's
     square framing. On the glasses it fills the field; in a desktop
     browser it renders an exact preview of what the wearer sees.
     overflow:hidden makes it the clipping window that the pan-clamp
     math below is defined against. */
  #stage {
    position: relative;
    width: 600px;
    height: 600px;
    overflow: hidden;
    background: #000;
    flex: none;
  }

  /* The <img> element box always fills the stage; object-fit:contain
     letterboxes the actual pixels inside it. Zoom/pan are applied
     purely via `transform` so every update is GPU-composited and no
     layout is invalidated. */
  #photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: 50% 50%;    /* symmetric overflow => symmetric clamp */
    will-change: transform;
    backface-visibility: hidden;
    -webkit-user-drag: none;
    display: none;                /* revealed only in READY */
  }

  /* Status text for LOADING / ERROR / EMPTY. Dim by design — it is
     diagnostic, not chrome, and never shares the screen with a photo. */
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 48px;
    text-align: center;
    font: 400 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.04em;
    color: #6b6b6b;
    white-space: pre-line;
  }
  #overlay.visible { display: flex; }
  #overlay.error   { color: #b4726a; }
</style>

<!-- Script order matches index.html exactly:
     config.js  ->  Supabase UMD build  ->  this page's app code. -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="stage">
    <img id="photo" alt="">
    <div id="overlay"></div>
  </div>

<script>
(function () {
  "use strict";

  /* ============================================================
     CONSTANTS
     ============================================================ */

  // Must equal #stage's CSS width/height. The clamp formula is
  // expressed against this clipping window.
  const VIEWPORT_W = 600;
  const VIEWPORT_H = 600;

  const ZOOM_LADDER = [1, 1.5, 2.5, 4];

  // Screen-space pixels travelled per directional press at scale 1.
  // The effective step is PAN_STEP_BASE * (1 / zoomScale), so the
  // step shrinks as you zoom in (per spec: finer control at higher
  // magnification). 200 keeps 1.5x within ~1 press of its limit
  // while leaving 4x precise enough to inspect detail.
  const PAN_STEP_BASE = 200;

  // Hardware bounce suppression: a keydown arriving less than this
  // long after the last *processed* one is dropped outright.
  const INPUT_DEBOUNCE_MS = 150;

  // Contrast boost for the waveguide, which washes out midtones in
  // ambient light. 1.35 visibly separates midtones while staying
  // under the ~1.5 point where speculars clip to flat white; the
  // slight saturation lift compensates for the perceptual desaturation
  // that raising contrast alone causes.
  const CONTRAST_FILTER = "contrast(1.35) saturate(1.08)";

  const BUCKET = window.SUPABASE_BUCKET || "lens";

  const APP = {
    LOADING: "LOADING",
    ERROR:   "ERROR",
    EMPTY:   "EMPTY",
    READY:   "READY"
  };

  /* ============================================================
     STATE  —  single source of truth
     ============================================================ */

  let appState = APP.LOADING;
  let photos   = [];
  let errorText = "";

  // READY-only viewport state.
  let pageIndex  = 0;
  let zoomScale  = 1;
  let panX       = 0;
  let panY       = 0;
  let contrastOn = false;

  // `mode` is DERIVED, never stored — the two can therefore never
  // disagree, which removes the whole class of input/visual desync
  // bugs that a separately-tracked mode flag invites.
  const mode = () => (zoomScale === 1 ? "BROWSE" : "ZOOMED");

  // On-screen size of the current image's painted pixels at scale 1,
  // i.e. after object-fit:contain letterboxing. Known only once the
  // image has loaded; 0 until then, which safely forces maxPan = 0.
  let renderedW = 0;
  let renderedH = 0;

  let client = null;
  let lastActionAt = 0;

  // index -> Image. Holds ONLY pageIndex-1 and pageIndex+1.
  const prefetch = new Map();

  const photoEl   = document.getElementById("photo");
  const overlayEl = document.getElementById("overlay");

  /* ============================================================
     SUPABASE
     ============================================================ */

  // Matches index.html's init pattern. The resulting client is also
  // published as window.supabaseClient so hardware/host integrations
  // can reach it, and is reused if something already defined it.
  function getClient() {
    if (client) return client;

    if (window.supabaseClient) {
      client = window.supabaseClient;
      return client;
    }
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      throw new Error("Supabase library failed to load.");
    }
    const url = window.SUPABASE_URL;
    const key = window.SUPABASE_ANON_KEY;
    if (!url || !key) {
      throw new Error("config.js is missing SUPABASE_URL or SUPABASE_ANON_KEY.");
    }
    // config.js ships with placeholders; fail loudly rather than
    // emitting an opaque DNS error from a bogus hostname.
    if (url.includes("YOUR-PROJECT-REF") || key.includes("YOUR-ANON")) {
      throw new Error("config.js still has placeholder credentials.");
    }
    client = window.supabase.createClient(url, key);
    window.supabaseClient = client;
    return client;
  }

  function urlFor(photo) {
    return getClient().storage.from(BUCKET).getPublicUrl(photo.storage_path).data.publicUrl;
  }

  async function loadGallery() {
    appState = APP.LOADING;
    errorText = "";
    render();

    try {
      // "order" is a reserved SQL word: quoted in the column list and
      // in .order() because both are identifier positions.
      const { data, error } = await getClient()
        .from("photos")
        .select('id, storage_path, "order", display_name')
        .order('"order"', { ascending: true });

      if (error) throw new Error(error.message || "Supabase returned an error.");

      photos = Array.isArray(data) ? data : [];

      if (photos.length === 0) {
        clearPrefetch();
        appState = APP.EMPTY;
        render();
        return;
      }

      // contrastOn deliberately survives a reload — it is a viewing
      // preference, not gallery state.
      pageIndex = 0;
      resetViewport();
      appState = APP.READY;
      showCurrentPage();

    } catch (err) {
      clearPrefetch();
      errorText = (err && err.message) ? err.message : String(err);
      appState = APP.ERROR;
      render();
    }
  }

  /* ============================================================
     VIEWPORT MATH
     ============================================================ */

  function resetViewport() {
    zoomScale = 1;
    panX = 0;
    panY = 0;
  }

  // Recomputed on every image load: the contain-fit of the natural
  // image into the 600x600 box.
  function measureRendered() {
    const nW = photoEl.naturalWidth;
    const nH = photoEl.naturalHeight;
    if (!nW || !nH) { renderedW = 0; renderedH = 0; return; }
    const fit = Math.min(VIEWPORT_W / nW, VIEWPORT_H / nH);
    renderedW = nW * fit;
    renderedH = nH * fit;
  }

  // Clamp pan to the scaled image's overflow beyond the viewport,
  // independently per axis. An axis whose scaled extent still fits
  // inside the viewport has maxPan 0 and is pinned to centre — there
  // is nothing off-screen to reveal on it.
  function clampPan() {
    const maxPanX = Math.max(0, (renderedW * zoomScale - VIEWPORT_W) / 2);
    const maxPanY = Math.max(0, (renderedH * zoomScale - VIEWPORT_H) / 2);
    panX = Math.min(maxPanX, Math.max(-maxPanX, panX));
    panY = Math.min(maxPanY, Math.max(-maxPanY, panY));
  }

  // translate BEFORE scale: CSS applies the translation in the
  // parent's coordinate space, unmultiplied by the scale. panX/panY
  // are therefore plain screen pixels — the same space the clamp
  // bounds above are computed in.
  function applyTransform() {
    photoEl.style.transform = "translate(" + panX + "px, " + panY + "px) scale(" + zoomScale + ")";
  }

  function applyContrast() {
    photoEl.style.filter = contrastOn ? CONTRAST_FILTER : "none";
  }

  /* ============================================================
     PAGING + PREFETCH
     ============================================================ */

  function clearPrefetch() {
    prefetch.forEach(function (img) { img.src = ""; });
    prefetch.clear();
  }

  // Memory isolation: warm ONLY the immediate neighbours, and drop
  // references to everything else so the tab's image cache stays
  // bounded regardless of gallery size.
  function updatePrefetchWindow() {
    const wanted = new Set();
    [pageIndex - 1, pageIndex + 1].forEach(function (i) {
      if (i >= 0 && i < photos.length) wanted.add(i);
    });

    prefetch.forEach(function (img, i) {
      if (!wanted.has(i)) {
        img.src = "";
        prefetch.delete(i);
      }
    });

    wanted.forEach(function (i) {
      if (prefetch.has(i)) return;
      const img = new Image();
      img.decoding = "async";
      img.src = urlFor(photos[i]);
      prefetch.set(i, img);
    });
  }

  function showCurrentPage() {
    const photo = photos[pageIndex];

    // Dimensions are unknown until the new image loads; zeroing them
    // holds maxPan at 0 so no stale bound from the previous photo can
    // leak through.
    renderedW = 0;
    renderedH = 0;

    photoEl.alt = photo.display_name || "";
    photoEl.src = urlFor(photo);

    applyTransform();
    applyContrast();
    updatePrefetchWindow();
    render();
  }

  photoEl.addEventListener("load", function () {
    measureRendered();
    clampPan();
    applyTransform();
    if (appState === APP.READY) render();
  });

  photoEl.addEventListener("error", function () {
    // A single unreachable object must not break the state machine:
    // stay in READY so the wearer can navigate off the bad page.
    renderedW = 0;
    renderedH = 0;
    if (appState === APP.READY) {
      showOverlay("Image unavailable\n" + (pageIndex + 1) + " / " + photos.length, false);
      photoEl.style.display = "none";
    }
  });

  /* ============================================================
     TRANSITIONS
     ============================================================ */

  function changePage(delta) {
    const next = Math.min(photos.length - 1, Math.max(0, pageIndex + delta));
    if (next === pageIndex) return false;        // hard clamp, no wraparound
    pageIndex = next;
    resetViewport();                             // page change always returns to BROWSE
    showCurrentPage();
    return true;
  }

  function advanceZoom() {
    const at = ZOOM_LADDER.indexOf(zoomScale);
    const nextIdx = ((at === -1 ? 0 : at) + 1) % ZOOM_LADDER.length;
    zoomScale = ZOOM_LADDER[nextIdx];
    if (zoomScale === 1) { panX = 0; panY = 0; }  // wrapped past 4 -> back to BROWSE
    clampPan();
    applyTransform();
    render();
    return true;
  }

  function panBy(dirX, dirY) {
    const step = PAN_STEP_BASE * (1 / zoomScale);
    panX += dirX * step;
    panY += dirY * step;
    clampPan();
    applyTransform();
    return true;
  }

  function toggleContrast() {
    contrastOn = !contrastOn;
    applyContrast();
    return true;
  }

  function resetViewportAction() {
    resetViewport();                              // pageIndex and contrastOn untouched
    clampPan();
    applyTransform();
    render();
    return true;
  }

  /* ============================================================
     INPUT
     ============================================================ */

  const KEY_ACTIONS = {
    "ArrowLeft":  "LEFT",
    "ArrowRight": "RIGHT",
    "ArrowUp":    "UP",
    "ArrowDown":  "DOWN",
    "Enter":      "SELECT",
    "c":          "CONTRAST",
    "C":          "CONTRAST",
    "r":          "RESET",
    "R":          "RESET"
  };

  // The one funnel every input passes through — keyboard and the
  // programmatic window.viewer hooks alike — so debounce and state
  // gating can never be bypassed by one path. Returns whether the
  // action was actually processed.
  function dispatch(action) {
    const now = (window.performance && performance.now) ? performance.now() : Date.now();
    if (now - lastActionAt < INPUT_DEBOUNCE_MS) return false;

    // ERROR is terminal except for retry.
    if (appState === APP.ERROR) {
      if (action !== "RESET") return false;
      lastActionAt = now;
      loadGallery();
      return true;
    }

    // LOADING and EMPTY swallow everything. EMPTY is genuinely
    // terminal — there is no gallery to retry into.
    if (appState !== APP.READY) return false;

    const zoomed = mode() === "ZOOMED";
    let handled = false;

    switch (action) {
      case "LEFT":     handled = zoomed ? panBy(-1, 0) : changePage(-1); break;
      case "RIGHT":    handled = zoomed ? panBy(+1, 0) : changePage(+1); break;
      case "UP":       handled = zoomed ? panBy(0, -1) : false;          break;
      case "DOWN":     handled = zoomed ? panBy(0, +1) : false;          break;
      case "SELECT":   handled = advanceZoom();     break;
      case "CONTRAST": handled = toggleContrast();  break;
      case "RESET":    handled = resetViewportAction(); break;
    }

    // Only a real state change counts as "processed", so an input at
    // a clamped edge does not start a debounce window that would eat
    // the wearer's next, valid press.
    if (handled) lastActionAt = now;
    return handled;
  }

  window.addEventListener("keydown", function (e) {
    if (e.repeat) return;                         // native key-repeat safeguard
    const action = KEY_ACTIONS[e.key];
    if (!action) return;
    e.preventDefault();
    dispatch(action);
  });

  /* ============================================================
     HOST INTERFACE
     ============================================================
     Hooks for intercepting hardware actions directly. They route
     through the same dispatch funnel as the keys, so next()/prev()
     are mode-dependent exactly like the arrows: they page in BROWSE
     and pan horizontally in ZOOMED. Each returns true if the action
     changed state, false if it was debounced or was a no-op. */
  window.viewer = {
    next:          function () { return dispatch("RIGHT"); },
    prev:          function () { return dispatch("LEFT"); },
    toggleZoom:    function () { return dispatch("SELECT"); },
    cycleContrast: function () { return dispatch("CONTRAST"); }
  };

  /* ============================================================
     RENDER
     ============================================================ */

  function showOverlay(text, isError) {
    overlayEl.textContent = text;
    overlayEl.classList.add("visible");
    overlayEl.classList.toggle("error", !!isError);
  }

  function hideOverlay() {
    overlayEl.classList.remove("visible", "error");
    overlayEl.textContent = "";
  }

  function render() {
    switch (appState) {
      case APP.LOADING:
        photoEl.style.display = "none";
        showOverlay("Loading", false);
        break;

      case APP.ERROR:
        photoEl.style.display = "none";
        showOverlay("Could not load gallery\n" + errorText + "\n\nPress R to retry", true);
        break;

      case APP.EMPTY:
        photoEl.style.display = "none";
        showOverlay("No photos yet", false);
        break;

      case APP.READY:
        hideOverlay();
        photoEl.style.display = "block";
        break;
    }
  }

  render();
  loadGallery();
})();
</script>
</body>
</html>
