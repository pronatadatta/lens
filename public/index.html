<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lens — Manage Photos</title>

<!-- Runtime config (SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_BUCKET) -->
<script src="config.js"></script>
<!-- Supabase JS client (UMD build, exposes window.supabase.createClient) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0d;
    --surface: #17171b;
    --surface-2: #212126;
    --border: #2c2c33;
    --text: #f2f2f4;
    --text-dim: #9a9aa2;
    --accent: #4f8cff;
    --danger: #ff5d5d;
    --radius: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }

  header {
    padding: 20px 16px 8px;
  }

  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 4px 0 0;
    color: var(--text-dim);
    font-size: 14px;
  }

  main {
    padding: 12px 16px 40px;
    max-width: 640px;
    margin: 0 auto;
  }

  /* --- Uploader --- */

  #uploader {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 8px 0 14px;
  }

  .upload-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    min-height: 52px; /* comfortable touch target */
    user-select: none;
  }

  .upload-btn:active { opacity: 0.85; }

  input[type="file"] { display: none; }

  #upload-status {
    margin-top: 10px;
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
  }

  /* --- Empty state --- */

  #empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 48px 16px;
    font-size: 15px;
  }

  /* --- Photo list --- */

  #photo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .photo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
  }

  .photo-row.busy { opacity: 0.5; pointer-events: none; }

  .thumb {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    object-fit: cover;
    flex: none;
    background: var(--surface-2);
  }

  .name {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .actions {
    display: flex;
    gap: 4px;
    flex: none;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }

  .icon-btn:active { background: #2a2a31; }

  .icon-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .icon-btn.danger { color: var(--danger); }

  /* --- Toast --- */

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 12px);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: 90vw;
    text-align: center;
    z-index: 20;
  }

  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
</head>
<body>

<header>
  <h1>Lens</h1>
  <p>Photos on your glasses, in order.</p>
</header>

<main>
  <section id="uploader">
    <label class="upload-btn" for="file-input">
      <span>+ Add Photos</span>
    </label>
    <input id="file-input" type="file" accept="image/*" multiple />
    <div id="upload-status" hidden></div>
  </section>

  <section id="empty-state" hidden>
    <p>No photos yet. Tap "Add Photos" to get started.</p>
  </section>

  <ul id="photo-list"></ul>
</main>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  var BUCKET = window.SUPABASE_BUCKET || "lens";
  var SELECT_COLUMNS = 'id, storage_path, "order", display_name, created_at';

  // Re-encode before upload. Phone screenshots arrive as multi-megabyte
  // PNGs — a format that is dreadful for photographs — and originals were
  // going up untouched, which is how this gallery reached 15.9 MB for seven
  // images. Matches Lawrence's DisplayImage: the viewer's stage is 600px
  // and its zoom tops out at 4x, so past ~2400px no byte can reach a lens
  // pixel. Drawing through a canvas also bakes in EXIF orientation.
  var MAX_UPLOAD_DIMENSION = 2048;
  var UPLOAD_QUALITY = 0.82;

  var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  var fileInput = document.getElementById("file-input");
  var listEl = document.getElementById("photo-list");
  var emptyEl = document.getElementById("empty-state");
  var statusEl = document.getElementById("upload-status");
  var toastEl = document.getElementById("toast");

  var photos = []; // local cache, kept in sync with the DB
  var toastTimer = null;
  var binSupported = true;   // cleared if the deleted_at migration is absent

  // ---------- helpers ----------

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function sanitizeFilename(name) {
    return String(name).replace(/[^a-zA-Z0-9.\-_]/g, "_");
  }

  function publicUrlFor(path) {
    return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }

  // Downscales and re-encodes to JPEG. Resolves to null on any failure so
  // the caller can fall back to the original file — a photo that uploads
  // large beats one that does not upload at all.
  function encodeForUpload(file) {
    return new Promise(function (resolve) {
      var objectUrl = URL.createObjectURL(file);
      var img = new Image();

      img.onload = function () {
        try {
          var longest = Math.max(img.naturalWidth, img.naturalHeight);
          if (!longest) { URL.revokeObjectURL(objectUrl); return resolve(null); }

          var scale = Math.min(1, MAX_UPLOAD_DIMENSION / longest);  // never upscale
          var w = Math.round(img.naturalWidth * scale);
          var h = Math.round(img.naturalHeight * scale);

          var canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext("2d");
          // JPEG has no alpha; without this, transparent PNG regions
          // encode as black instead of white.
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(objectUrl);

          canvas.toBlob(function (blob) {
            // Guard the pathological case: a small, already-optimised JPEG
            // can come out bigger after a round trip. Keep the smaller one.
            resolve(blob && blob.size < file.size ? blob : null);
          }, "image/jpeg", UPLOAD_QUALITY);
        } catch (err) {
          URL.revokeObjectURL(objectUrl);
          resolve(null);
        }
      };

      // Formats the browser cannot decode (some HEIC) land here.
      img.onerror = function () {
        URL.revokeObjectURL(objectUrl);
        resolve(null);
      };

      img.src = objectUrl;
    });
  }

  function kb(bytes) { return Math.round(bytes / 1024) + " KB"; }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 3000);
  }

  function setUploading(isUploading, message) {
    statusEl.hidden = !isUploading;
    statusEl.textContent = message || "";
    fileInput.disabled = isUploading;
  }

  // ---------- data ----------

  // A pre-migration database has no deleted_at column. Detect that once
  // and fall back to the unfiltered query, so this page keeps working
  // whether or not the recycle-bin migration has been run yet.
  function isMissingDeletedAt(error) {
    const blob = ((error && error.message) || "") + " " +
                 ((error && error.code) || "") + " " +
                 ((error && error.details) || "");
    const s = blob.toLowerCase();
    return s.indexOf("deleted_at") !== -1 || s.indexOf("42703") !== -1;
  }

  function loadPhotos() {
    // "order" is a reserved SQL word — quoted in the schema, so it must be
    // quoted here too, both in the select column list and in .order().
    // Binned photos are excluded: one deleted on the glasses must not
    // keep showing up here, or the two views disagree about what exists.
    var query = binSupported
      ? sb.from("photos").select(SELECT_COLUMNS).is("deleted_at", null)
      : sb.from("photos").select(SELECT_COLUMNS);

    return query
      .order('"order"', { ascending: true })
      .then(function (res) {
        if (res.error) {
          if (binSupported && isMissingDeletedAt(res.error)) {
            binSupported = false;
            return loadPhotos();
          }
          toast("Failed to load photos: " + res.error.message);
          return;
        }
        photos = res.data || [];
        render();
      });
  }

  // ---------- render ----------

  function render() {
    emptyEl.hidden = photos.length !== 0;
    listEl.innerHTML = "";

    photos.forEach(function (p, i) {
      var li = document.createElement("li");
      li.className = "photo-row";
      li.dataset.id = p.id;

      var label = p.display_name || p.storage_path;

      li.innerHTML =
        '<img class="thumb" loading="lazy" src="' + escapeHtml(publicUrlFor(p.storage_path)) + '" alt="" />' +
        '<span class="name">' + escapeHtml(label) + "</span>" +
        '<div class="actions">' +
          '<button class="icon-btn" data-action="up" ' + (i === 0 ? "disabled" : "") + ' aria-label="Move up">&uarr;</button>' +
          '<button class="icon-btn" data-action="down" ' + (i === photos.length - 1 ? "disabled" : "") + ' aria-label="Move down">&darr;</button>' +
          '<button class="icon-btn danger" data-action="delete" aria-label="Delete">&#128465;</button>' +
        "</div>";

      listEl.appendChild(li);
    });
  }

  // ---------- reordering ----------

  function swapOrder(i, j) {
    var a = photos[i], b = photos[j];
    var aOrder = a.order, bOrder = b.order;
    var row = listEl.children[i];
    if (row) row.classList.add("busy");

    // Optimistic local swap so the UI feels instant.
    photos[i] = b;
    photos[j] = a;
    render();

    return Promise.all([
      sb.from("photos").update({ order: bOrder }).eq("id", a.id),
      sb.from("photos").update({ order: aOrder }).eq("id", b.id),
    ]).then(function (results) {
      var failed = results.some(function (r) { return r.error; });
      if (failed) {
        toast("Reorder failed — refreshing list");
        return loadPhotos();
      }
      // Keep local order fields in sync with what we just wrote.
      a.order = bOrder;
      b.order = aOrder;
    });
  }

  // ---------- delete ----------

  // Soft delete when the migration is present, so this button and the
  // glasses agree on what "delete" means: the photo goes to the bin and
  // stays recoverable for 7 days. Without the migration there is no bin
  // to go to, so it falls back to the old permanent delete — and says so.
  function deletePhoto(photo) {
    var label = photo.display_name || photo.storage_path;

    if (!binSupported) {
      if (!window.confirm('Delete "' + label + '" permanently? This can\'t be undone.')) {
        return Promise.resolve();
      }
      toast("Deleting…");
      return sb.storage.from(BUCKET).remove([photo.storage_path]).then(function (storageRes) {
        if (storageRes.error) throw new Error("Storage: " + storageRes.error.message);
        return sb.from("photos").delete().eq("id", photo.id);
      }).then(function (dbRes) {
        if (dbRes.error) throw new Error("Database: " + dbRes.error.message);
        photos = photos.filter(function (p) { return p.id !== photo.id; });
        render();
        toast("Deleted");
      }).catch(function (err) {
        toast("Delete failed: " + err.message);
      });
    }

    if (!window.confirm('Move "' + label + '" to the recycle bin?')) {
      return Promise.resolve();
    }
    toast("Moving to bin…");

    return sb.from("photos")
      .update({ deleted_at: new Date().toISOString() })
      .eq("id", photo.id)
      .then(function (res) {
        if (res.error) throw new Error(res.error.message);
        photos = photos.filter(function (p) { return p.id !== photo.id; });
        render();
        toast("Moved to bin");
      }).catch(function (err) {
        toast("Delete failed: " + err.message);
      });
  }

  // ---------- upload ----------

  function uploadFiles(files) {
    setUploading(true, "Uploading 0/" + files.length + "…");

    var nextOrder = photos.length
      ? Math.max.apply(null, photos.map(function (p) { return p.order; })) + 1
      : 0;
    var done = 0;

    // Sequential (not parallel) — order must increment predictably per
    // file, and it keeps memory/network use bounded on a phone connection.
    var chain = Promise.resolve();
    var savedBytes = 0;
    files.forEach(function (file) {
      chain = chain.then(function () {
        var order = nextOrder;
        nextOrder += 1;

        setUploading(true, "Preparing " + (done + 1) + "/" + files.length + "…");

        return encodeForUpload(file).then(function (encoded) {
          // Null means the browser could not decode it, or re-encoding made
          // it bigger. Either way the original goes up unchanged.
          var body = encoded || file;
          var type = encoded ? "image/jpeg" : (file.type || "application/octet-stream");
          var base = sanitizeFilename(file.name);
          // The stored name has to match the bytes, or the transform
          // endpoint and every browser will trust the wrong decoder.
          var path = crypto.randomUUID() + "-" +
                     (encoded ? base.replace(/\.[^.]+$/, "") + ".jpg" : base);

          if (encoded) savedBytes += (file.size - encoded.size);
          setUploading(true, "Uploading " + (done + 1) + "/" + files.length +
                             " · " + kb(body.size) +
                             (encoded ? " (was " + kb(file.size) + ")" : ""));

          return sb.storage
            .from(BUCKET)
            .upload(path, body, { contentType: type, upsert: false })
            .then(function (uploadRes) {
              if (uploadRes.error) throw uploadRes.error;
              return sb
                .from("photos")
                .insert({ storage_path: path, order: order, display_name: file.name })
                .select(SELECT_COLUMNS)
                .single();
            });
        })
          .then(function (insertRes) {
            if (insertRes.error) throw insertRes.error;
            photos.push(insertRes.data);
          })
          .catch(function (err) {
            toast("Failed to upload " + file.name + ": " + (err.message || err));
          })
          .then(function () {
            done += 1;
          });
      });
    });

    return chain.then(function () {
      setUploading(false);
      render();
      if (savedBytes > 0) toast("Saved " + kb(savedBytes) + " by re-encoding");
    });
  }

  // ---------- events ----------

  listEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-action]");
    if (!btn) return;
    var row = btn.closest(".photo-row");
    var id = row && row.dataset.id;
    var idx = photos.findIndex(function (p) { return p.id === id; });
    if (idx === -1) return;

    var action = btn.dataset.action;
    if (action === "up" && idx > 0) swapOrder(idx, idx - 1);
    else if (action === "down" && idx < photos.length - 1) swapOrder(idx, idx + 1);
    else if (action === "delete") deletePhoto(photos[idx]);
  });

  fileInput.addEventListener("change", function () {
    var files = Array.prototype.slice.call(fileInput.files || []);
    fileInput.value = ""; // allow re-selecting the same file later
    if (files.length) uploadFiles(files);
  });

  // ---------- init ----------

  loadPhotos();
})();
</script>

</body>
</html>
